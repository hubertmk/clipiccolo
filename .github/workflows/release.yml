name: Release

# Push a vX.Y.Z tag to build the signed installer and portable exe and open a DRAFT release with them
# (review it, then publish). "Run workflow" by hand builds the same files as a workflow artifact only.
#
# Needs two repository secrets, made by signing\new-cert.ps1: SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # gyan.dev "essentials" build, from its pinned GitHub releases. Bump all three together.
  FFMPEG_VERSION: '8.0'
  FFMPEG_ZIP_SHA256: 647e467caf82b9fa200a562769b5ff4d736aaf725804ed2c64ea9752106fa569
  FFMPEG_SRC_SHA256: b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check versions
        id: version
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = @{
            'src-tauri/Cargo.toml' = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            'launcher/Cargo.toml'  = (Select-String -Path launcher/Cargo.toml  -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          foreach ($f in $cargo.Keys) { if ($cargo[$f] -ne $v) { throw "$f has version $($cargo[$f]), tauri.conf.json has $v" } }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $v in tauri.conf.json"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            launcher
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install zstandard

      - name: Fetch ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          gh release download $env:FFMPEG_VERSION -R GyanD/codexffmpeg -p $zip -D $env:RUNNER_TEMP
          $path = Join-Path $env:RUNNER_TEMP $zip
          if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $env:FFMPEG_ZIP_SHA256) { throw "$zip checksum mismatch" }
          Expand-Archive $path (Join-Path $env:RUNNER_TEMP ffmpeg)
          Copy-Item (Join-Path $env:RUNNER_TEMP "ffmpeg/ffmpeg-$env:FFMPEG_VERSION-essentials_build/bin/ffmpeg.exe") src-tauri/resources/ffmpeg.exe

      - name: Import signing certificate
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw 'Secrets SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD are missing (see signing\new-cert.ps1).'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx
          "CLIPICCOLO_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build installer
        run: ./build-installer.ps1 -RequireSigning
      - name: Build portable exe
        run: ./build-portable.ps1 -RequireSigning

      - name: Collect release files
        run: |
          $src = "ffmpeg-$env:FFMPEG_VERSION.tar.xz"
          Invoke-WebRequest "https://ffmpeg.org/releases/$src" -OutFile "dist/$src"
          if ((Get-FileHash "dist/$src" -Algorithm SHA256).Hash -ne $env:FFMPEG_SRC_SHA256) { throw "$src checksum mismatch" }
          Copy-Item signing/clipiccolo-codesign.cer dist/
          $files = "Clipiccolo-Setup-${{ steps.version.outputs.version }}.exe", 'Clipiccolo.exe', 'clipiccolo-codesign.cer', $src
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash "dist/$_" -Algorithm SHA256).Hash.ToLower(), $_ } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: clipiccolo-${{ steps.version.outputs.version }}
          path: |
            dist/Clipiccolo-Setup-${{ steps.version.outputs.version }}.exe
            dist/Clipiccolo.exe
            dist/clipiccolo-codesign.cer
            dist/SHA256SUMS.txt

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $files = "dist/Clipiccolo-Setup-$v.exe", 'dist/Clipiccolo.exe', 'dist/clipiccolo-codesign.cer',
            "dist/ffmpeg-$env:FFMPEG_VERSION.tar.xz", 'dist/SHA256SUMS.txt'
          # Release (macOS) runs on the same tag and may have created the draft already.
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME --draft --title "Clipiccolo $v" --generate-notes @files
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
