# Builds the signed, notarized and stapled macOS disk image on GitHub and attaches it to a draft release.
# Setup (certificate, App Store Connect key, secrets): docs/mac-release-github.md.
name: Release (macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the draft release and upload the DMG

jobs:
  dmg:
    runs-on: macos-latest # Apple Silicon
    env:
      # Same static arm64 build as the local one (see the top of build-mac.sh); bump both together.
      FFMPEG_URL: https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip
      FFMPEG_SHA256: c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $v in tauri.conf.json"; exit 1; }

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: ffmpeg (pinned, checksum-verified)
        run: |
          curl -fsSL "$FFMPEG_URL" -o "$RUNNER_TEMP/ffmpeg.zip"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"
          echo "FFMPEG_BIN=$RUNNER_TEMP/ffmpeg/ffmpeg" >> "$GITHUB_ENV"

      - name: App Store Connect key file
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] \
            || { echo "Notarization secrets missing (see docs/mac-release-github.md)"; exit 1; }
          # notarytool's PEM parser is strict (header/footer, 64-column lines). Rebuild a canonical PEM from whatever
          # was pasted: the .p8 as-is, CRLF, a single line, literal "\n", body only, or the whole file base64-encoded.
          python3 - "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64, binascii, os, re, sys, textwrap
          s = os.environ["P8"].replace("\\n", "\n")
          if "PRIVATE KEY" not in s:
              try:
                  d = base64.b64decode("".join(s.split()), validate=True).decode()
                  if "PRIVATE KEY" in d:
                      s = d
              except (binascii.Error, UnicodeDecodeError):
                  pass
          body = "".join(re.sub(r"-----[A-Z ]+-----", "", s).split())
          try:
              der = base64.b64decode(body, validate=True)
          except binascii.Error:
              sys.exit("APPLE_API_KEY_P8 is not a .p8 key; set it with: gh secret set APPLE_API_KEY_P8 < AuthKey_<KEYID>.p8")
          lines = "\n".join(textwrap.wrap(base64.b64encode(der).decode(), 64))
          with open(sys.argv[1], "w") as f:
              f.write(f"-----BEGIN PRIVATE KEY-----\n{lines}\n-----END PRIVATE KEY-----\n")
          PY
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout \
            || { echo "APPLE_API_KEY_P8 does not contain a valid private key (see docs/mac-release-github.md)"; exit 1; }
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Fail in seconds rather than after the 20-minute build if the key, Key ID or Issuer ID is wrong.
      - name: Check notarization credentials
        run: |
          xcrun notarytool history --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" >/dev/null

      # Tauri imports APPLE_CERTIFICATE into a temporary keychain, signs, then notarizes and staples the app.
      - name: Build, sign and notarize the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Hubert Kerschbaum (T6G2PWFUFQ)'
        run: ./build-mac.sh

      - name: Notarize and staple the disk image
        run: |
          dmg=$(ls dist/Clipiccolo-*-mac-arm64.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: clipiccolo-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Clipiccolo ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
