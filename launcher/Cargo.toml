[package]
name = "Clipiccolo"
version = "0.5.0"
description = "Portable single-file launcher for Clipiccolo"
authors = ["Hubert Maria Kerschbaum"]
license = "MIT"
repository = "https://github.com/hubertmk/clipiccolo"
edition = "2021"
publish = false

[dependencies]
ruzstd = "0.8"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
