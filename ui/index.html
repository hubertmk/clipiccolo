<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipiccolo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top" data-tauri-drag-region="">
      <button id="backBtn" class="icon-btn hidden" title="Back" aria-label="Back">
        <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>

      <!-- The "Due punti" tile: a big crema dot holding the video, a small pistachio dot (brand/mark.svg). -->

      <div class="titles" data-tauri-drag-region="">

"-627.1" r="57.1" fill="#8DB443"/></svg></h1>
        <p id="subtitle" data-tauri-drag-region="">Small MP4s, ready to share</p>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg class="i" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
      <button id="minBtn" class="icon-btn" title="Minimize" aria-label="Minimize">
        <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg>
      </button>
      <button id="closeBtn" class="icon-btn close" title="Close" aria-label="Close">
        <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </header>

    <section class="view" id="home">
      <div class="drop" id="drop" role="button" tabindex="0" aria-label="Drop or paste videos here, or browse" title="Drop video files, or paste a file or link with Ctrl+V">
        <svg class="i big" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 8h20M6 4v4M10 4v4M14 4v4M18 4v4"></path><path d="M12 17v-6M9.5 13.5 12 11l2.5 2.5"></path></svg>
        <div class="drop-title">Drop or paste videos</div>
        <div class="drop-text" id="dropText">Any format · saved next to the original</div>
        <button class="btn small primary" id="browseBtn" tabindex="-1">Browse…</button>
      </div>

      <div class="quality">
        <div class="seg" id="preset" role="radiogroup" aria-label="Quality">
          <button role="radio" data-preset="small">Small</button>
          <button role="radio" data-preset="balanced">Balanced</button>
          <button role="radio" data-preset="sharp">Sharp</button>
        </div>
        <div class="hint" id="presetHint"></div>
      </div>

      <!-- Shown once, on the very first start, until the first video or the × -->
      <div class="tip hidden" id="tip" role="note">
        <svg class="i" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
        <span class="grow">Copy a video anywhere, then switch here: it shrinks on its own and the small file lands on your clipboard, ready to paste.</span>
        <button class="icon-btn" id="tipClose" title="Got it" aria-label="Dismiss tip"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>

      <div class="status hidden" id="status" role="status">
        <span id="statusIcon"></span>
        <div class="grow">
          <div class="status-title" id="statusTitle"></div>
          <div class="status-text" id="statusText"></div>
        </div>
      </div>

      <ul class="queue card hidden" id="queue"></ul>
    </section>

    <section class="view hidden" id="settings">
      <div class="card">
        <div class="row">
          <div class="grow">
            <div class="title">Save converted videos</div>
            <div class="desc path" id="outDirText"></div>
          </div>
          <button class="btn ghost small hidden" id="outDirReset">Default</button>
          <button class="btn small" id="outDirBtn">Change…</button>
        </div>
        <label class="row" for="autoPaste">
          <div class="grow">
            <div class="title">Convert copied videos</div>
            <div class="desc">When you switch to Clipiccolo and the clipboard holds a new video file or a link to one. Ctrl+V always works.</div>
          </div>
          <input type="checkbox" class="switch" id="autoPaste">
        </label>
        <label class="row" for="autoCopy">
          <div class="grow">
            <div class="title">Copy converted videos</div>
            <div class="desc">When a batch is done, the small videos go to the clipboard — right away if Clipiccolo is in front, otherwise when you switch back. Paste anywhere with Ctrl+V.</div>
          </div>
          <input type="checkbox" class="switch" id="autoCopy">
        </label>
      </div>
      <div class="settings-footer">
        <span class="muted" id="version">Clipiccolo</span>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"></rect><path d="M4 16V5a1 1 0 0 1 1-1h11"></path><path d="m11.5 14.5 2 2 4-4"></path></svg>
      <span id="toastText"></span>
    </div>

    <footer class="bottom" id="footer">
      <span id="summary" class="muted">Output: MP4 (H.264) — plays everywhere</span>
      <span class="footer-actions">
        <button class="linkish hidden" id="copyAllBtn" title="Copy all finished videos (Ctrl+C)">Copy all</button>
        <button class="linkish hidden" id="cancelBtn">Cancel</button>
        <button class="linkish hidden" id="clearBtn">Clear list</button>
      </span>
    </footer>
  </main>
  <script src="app.js"></script>


</body></html>
